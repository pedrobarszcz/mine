name: ZIP to JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Validate and convert ZIP to JAR
        run: |
          unzip -t "$ZIP_FILE"
          cp "$ZIP_FILE" converted.jar

      - name: Upload converted JAR
        uses: actions/upload-artifact@v4
        with:
          name: converted-jar
          path: converted.jar
